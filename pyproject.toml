[project]
name = "stylegan3-gen-faces-script"
version = "1.0.1"
description = "Generate random face images with a pretrained StyleGAN3 network"
readme = "README.md"
# <3.12 because dnnlib does `from distutils.util import strtobool`, and distutils
# was removed from the stdlib in 3.12.
requires-python = ">=3.9,<3.12"

dependencies = [
    "numpy<2",
    "pillow>=11.3.0",
    "requests>=2.32.5",
    "tqdm>=4.70.1",
    # legacy.py (StyleGAN3) imports click at module level.
    "click",
    # StyleGAN3 network pickles import scipy at unpickle time.
    "scipy",
    # StyleGAN3's torch_utils.ops.conv2d_gradfix imports pkg_resources,
    # which was removed from setuptools 81+.
    "setuptools<80",
    "ninja>=1.13.2",
]

# Torch is opt-in via extras so CPU-only machines don't pull ~2 GB of
# unused CUDA wheels. Pick exactly one at install time:
#   uv sync --extra cpu     # CPU-only build (~200 MB)
#   uv sync --extra cuda    # CUDA 12.4 build (default before this split)
[project.optional-dependencies]
cpu  = ["torch==2.6.0"]
cuda = ["torch==2.6.0"]

[tool.uv]
# `cpu` and `cuda` install the same package from different indexes, so
# uv needs to be told they are alternatives, not additive.
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu",   extra = "cpu"  },
    { index = "pytorch-cu124", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
